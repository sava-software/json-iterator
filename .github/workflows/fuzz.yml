name: Fuzz

# Optional manual GitHub campaign. Release evidence is produced by the explicit
# local fuzzAll campaign and retained receipt; this workflow has no cron contract.
on:
  workflow_dispatch:
    inputs:
      max-fuzz-time:
        description: Seconds to run each fuzz target.
        required: false
        default: "900"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - id: setup
        uses: sava-software/sava-build@main
        with:
          default-java-version: ${{ vars.JAVA_VERSION }}
          jdk-src: ${{ vars.JDK_SRC }}
          gradle-java-version: ${{ vars.GRADLE_JAVA_VERSION }}

      # integer ceiling; 4 = the registered fuzz targets in the run below. The
      # regex guard is load-bearing: bash arithmetic resolves alphabetic garbage
      # as an unset variable, silently budgeting 0 seconds of fuzzing
      - id: budget
        name: Compute fuzz time budget
        env:
          MAX_FUZZ_TIME: ${{ inputs.max-fuzz-time || '900' }}
        run: |
          [[ "$MAX_FUZZ_TIME" =~ ^[1-9][0-9]*$ ]] || { echo "max-fuzz-time must be positive whole seconds, no leading zeros: '$MAX_FUZZ_TIME'" >&2; exit 1; }
          echo "timeout-minutes=$(( (4 * MAX_FUZZ_TIME + 59) / 60 + 30 ))" >> "$GITHUB_OUTPUT"

      # --continue, or the first crashing target skips every remaining one —
      # inverting the campaign's purpose on exactly the runs it matters. The
      # timeout lives on the step, not the job: a cancelled job never fires
      # `if: failure()` and the findings upload is silently lost.
      - name: Fuzz
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.timeout-minutes) }}
        run: >
          ./gradlew --stacktrace --continue
          -PjavaVersion=${{ steps.setup.outputs.java-version }}
          -PmaxFuzzTime=${{ inputs.max-fuzz-time || '900' }}
          :json-iterator:fuzzJson :json-iterator:fuzzDouble
          :json-iterator:fuzzNumber :json-iterator:fuzzInstant
        # standalone Gradle invocations resolve dependencies themselves, so the
        # credentials the reusable check workflow injects must be repeated here —
        # a copy without them fails at configuration, before any fuzzing runs
        env:
          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.READ_SAVA_PACKAGES }}

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          # Jazzer writes crash-*/oom-*/timeout-* reproducers into the module
          # working directory; the working corpora hold the inputs that led there
          path: |
            json-iterator/crash-*
            json-iterator/oom-*
            json-iterator/timeout-*
            json-iterator/build/fuzz/
          if-no-files-found: ignore
